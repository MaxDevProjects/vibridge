name: Prepare ViBridge security rollout
on:
  push:
    branches: [codex/vibridge-release-preflight]
permissions:
  contents: read
concurrency: vibridge-security-preflight
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Back up SQLite and stage the relay key
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_PATH
          script: |
            set -eu
            cd "$SERVER_PATH"
            umask 077
            test -f .env && test ! -L .env
            state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/vibridge"
            mkdir -p "$state_dir"
            chmod 700 "$state_dir"
            marker="$state_dir/security-rollout-0b591bf.prepared"
            if test -f "$marker"; then
              printf '%s\n' 'SQLite backup and secret rotation already prepared.'
              exit 0
            fi
            docker-compose -f docker-compose.prod.yml config -q
            docker exec devbridge-relay node -e '
              const ttl = Number(process.env.RELAY_SESSION_TTL_MS ?? 43200000)
              if (!Number.isSafeInteger(ttl) || ttl < 1000 || ttl > 2147483647) process.exit(1)
            '
            backup=$(mktemp "$state_dir/relay-before-0b591bf-XXXXXXXX.sqlite3")
            next_env=$(mktemp ./.env.vibridge-XXXXXXXX)
            trap 'rm -f "$next_env"' EXIT
            if ! docker exec devbridge-relay node -e '
              const fs = require("node:fs")
              const os = require("node:os")
              const path = require("node:path")
              const { pipeline } = require("node:stream/promises")
              const Database = require("better-sqlite3")
              async function backup() {
                const dir = fs.mkdtempSync(path.join(os.tmpdir(), "vibridge-backup-"))
                try {
                  const file = path.join(dir, "backup.db")
                  const db = new Database(process.env.RELAY_DB_PATH || "/data/relay.db", { readonly: true, fileMustExist: true })
                  try { await db.backup(file) } finally { db.close() }
                  const copy = new Database(file, { readonly: true })
                  try {
                    if (copy.pragma("quick_check", { simple: true }) !== "ok") throw new Error("SQLite backup integrity check failed")
                  } finally { copy.close() }
                  await pipeline(fs.createReadStream(file), process.stdout)
                } finally { fs.rmSync(dir, { recursive: true, force: true }) }
              }
              backup().catch(error => { console.error(error.message); process.exitCode = 1 })
            ' > "$backup"; then
              rm -f "$backup"
              exit 1
            fi
            test -s "$backup"
            openssl rand -hex 32 | awk '
              NR == FNR { secret = $0; next }
              /^[[:space:]]*(export[[:space:]]+)?RELAY_JWT_SECRET[[:space:]]*=/ { next }
              { print }
              END {
                if (length(secret) != 64) exit 1
                print "RELAY_JWT_SECRET=" secret
              }
            ' - .env > "$next_env"
            docker-compose --env-file "$next_env" -f docker-compose.prod.yml config -q
            cp .env "$backup.env"
            chmod 600 "$backup.env"
            mv "$next_env" .env
            printf '%s\n' "$backup" > "$marker"
            printf '%s\n' 'Verified SQLite snapshot saved and new relay secret staged. Running containers were not restarted.'
