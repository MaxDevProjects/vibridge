name: Deploy to server

# Human-in-the-loop release: merging a PR must not silently deploy to a VPS.
on:
  workflow_dispatch:

concurrency:
  group: vibridge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_PATH
          script: |
            set -eu
            cd "$SERVER_PATH"
            # Fail instead of overwriting manually adjusted VPS files.
            if [ "$(git branch --show-current)" != "main" ]; then
              echo "Expected the VPS repository to be on main" >&2
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Uncommitted VPS changes detected. Back them up and reconcile before deployment." >&2
              exit 1
            fi
            git fetch origin main
            git merge --ff-only origin/main

            # Compose V2 is required; never silently fall back to legacy V1.
            docker compose version
            compose() { docker compose -f docker-compose.prod.yml "$@"; }

            # Old releases used a different Compose project name. 'compose rm ui'
            # cannot remove a container owned by that previous project, while the
            # fixed container_name 'devbridge-ui' prevents the replacement from starting.
            # Only migrate a verified legacy UI from this exact checkout directory.
            remove_legacy_ui_if_owned() {
              if ! docker container inspect devbridge-ui >/dev/null 2>&1; then
                return 0
              fi
              old_service=$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' devbridge-ui)
              old_root=$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' devbridge-ui)
              old_project=$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' devbridge-ui)
              expected_root=$(pwd -P)

              if [ "$old_service" != "ui" ] || [ "$old_root" != "$expected_root" ]; then
                echo "Refusing to replace /devbridge-ui: container ownership could not be verified." >&2
                printf 'Existing project: %s; service: %s; working directory: %s\n' "$old_project" "$old_service" "$old_root" >&2
                printf 'Expected service: ui; working directory: %s\n' "$expected_root" >&2
                echo "Inspect this container manually; no other container will be removed." >&2
                exit 1
              fi

              printf 'Migrating legacy VibeBridge UI from Compose project %s\n' "$old_project"
              docker container stop devbridge-ui >/dev/null
              # Do not pass -v: named volumes and project data must remain untouched.
              docker container rm devbridge-ui >/dev/null
            }

            deploy_service() {
              service=$1
              compose build "$service"
              # The current Compose project can remove only containers it owns.
              compose rm --stop --force "$service"
              if [ "$service" = "ui" ]; then
                remove_legacy_ui_if_owned
              fi
              compose up -d --no-build --no-deps "$service"
            }

            wait_for_http() {
              container=$1
              endpoint=$2
              attempt=0
              while [ "$attempt" -lt 20 ]; do
                if docker exec "$container" node -e '
                  fetch(process.argv[1], { signal: AbortSignal.timeout(3000) })
                    .then(response => { if (!response.ok) process.exitCode = 1 })
                    .catch(() => { process.exitCode = 1 })
                ' "$endpoint" >/dev/null 2>&1; then
                  return 0
                fi
                sleep 3
                attempt=$((attempt + 1))
              done
              docker logs --tail 30 "$container" >&2 || true
              printf '%s\n' "$container never became healthy" >&2
              return 1
            }

            compose config -q
            deploy_service relay
            wait_for_http devbridge-relay http://127.0.0.1:4444/health
            deploy_service ui
            wait_for_http devbridge-ui http://127.0.0.1:4000/
